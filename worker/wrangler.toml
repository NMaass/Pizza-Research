name = "pizza-research"
main = "src/index.ts"
compatibility_date = "2024-10-18"
compatibility_flags = ["nodejs_compat"]

# Custom domain on nmaass.dev. Wrangler provisions DNS + SSL.
routes = [
  { pattern = "pizza-research.nmaass.dev", custom_domain = true }
]

[observability]
enabled = true
head_sampling_rate = 1

[durable_objects]
bindings = [
  { name = "COMBO_TRACKER", class_name = "ComboTracker" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ComboTracker"]

[vars]
CORS_ORIGIN = "https://pizza-research.nmaass.dev"

# KV namespace for topping taxonomy and leaderboard caches
[[kv_namespaces]]
binding = "PIZZA_KV"
id = "ae1b5f869402446ba733495c4c49a325"

[assets]
directory = "../client/dist"
not_found_handling = "single-page-application"
